name: Gottesdienste-Kalender aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"      # täglich ca. 5:17/6:17 Uhr Ortszeit
  workflow_dispatch: {}        # zusätzlich per Knopfdruck startbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python gottesdienste_ics.py
      - name: Änderungen committen
        run: |
          git config user.name "kalender-bot"
          git config user.email "kalender-bot@users.noreply.github.com"
          git add gottesdienste.ics events.json
          git diff --cached --quiet || (git commit -m "Gottesdienste aktualisiert" && git push)
